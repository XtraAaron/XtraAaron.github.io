<style>
  body {
    font-family: Helvetica, sans-serif;
    background: #1a1a1a;
    color: #eee;
    text-align: center;
    padding: 50px;
  }

  .box {
    display: inline-block;
    padding: 30px 60px;
    background: #333;
    border-radius: 8px;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  .box:hover {
    background: #555;
    transform: scale(1.05);
  }

  a {
    color: #6cf;
    text-decoration: none;
    transition: color 0.3s ease;
  }

  a:hover {
    color: #fff;
  }
</style>
