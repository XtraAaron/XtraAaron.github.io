<!DOCTYPE html>
<link rel="stylesheet" type="text/css" href="mainPageStyleSheet.css">
<link rel="stylesheet" href="https://fonts.google.com/icons">


<html>
<head>
<style>
  body {
    font-family: sans-serif;
    background: #1a1a1a;
    color: #eee;
    text-align: center;
    padding: 50px;
  }

  .box {
    display: inline-block;
    padding: 20px 40px;
    background: #333;
    border-radius: 8px;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  .box:hover {
    background: #555;
    transform: scale(1.05);
  }

  a {
    color: #6cf;
    text-decoration: none;
    transition: color 0.3s ease;
  }

  a:hover {
    color: #fff;
  }
</style>

 <meta charset="utf-8" />
 <title>Aaron Yee</title>
</head>
<body>

  <h1>My Page</h1>
  <p>Some text here.</p>

  <div class="box">Hover over me</div>

  <p><a href="#">A link that changes color</a></p>

</body>
</html>
